# =============================================================================
# casa.conf - PRODUCCION  (proxy inverso 192.168.100.100)
#
# Copia de /etc/nginx/conf.d/casa.conf con 3 cambios, todos dentro del
# location / de casaexpress.metabooks.com.mx. Nada mas fue modificado:
# los dominios, certificados, redirecciones y el bloque /socket.io/ quedan
# exactamente igual.
#
#   1. proxy_read_timeout   60 -> 3600
#   2. proxy_send_timeout   60 -> 3600
#   3. proxy_buffering off          (nuevo)
#
# POR QUE: este archivo es del 2026-06-17 y el modulo de licencias masivas
# llego despues, asi que sus timeouts nunca se ajustaron para el.
#
# COMO APLICARLO (en el 192.168.100.100):
#   cp /etc/nginx/conf.d/casa.conf /root/casa.conf.$(date +%F)   # respaldo
#   # subir este archivo a /etc/nginx/conf.d/casa.conf
#   nginx -t                      # NO recargar si esto falla
#   systemctl reload nginx
#
# Para revertir: restaurar el respaldo, nginx -t y recargar.
# El reload afecta a todos los sitios de esa maquina, no solo a Casa.
# =============================================================================

# ============================================
# CASA - Frontend Angular (puerto 80 interno)
# ============================================
server
{
   server_name casa.metabooks.com.mx;

   location /
   {
      proxy_pass http://192.168.100.25/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60;
      proxy_send_timeout 60;
      proxy_connect_timeout 10;
   }

   listen 443 ssl; # managed by Certbot
   ssl_certificate /etc/letsencrypt/live/casa.metabooks.com.mx/fullchain.pem; # managed by Certbot
   ssl_certificate_key /etc/letsencrypt/live/casa.metabooks.com.mx/privkey.pem; # managed by Certbot
   include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
   ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ============================================
# CASA EXPRESS - Backend Node.js (puerto 3000)
# ============================================
server
{
   server_name casaexpress.metabooks.com.mx;

   # Permitir subidas hasta 20GB
   client_max_body_size 20G;
   client_body_timeout 86400s;
   client_body_buffer_size 128k;

   # ======= SOCKET.IO (WebSocket) - ruta separada =======
   location /socket.io/ {
      proxy_pass http://192.168.100.25:3000/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Timeouts largos SOLO para WebSocket
      proxy_read_timeout 86400;
      proxy_send_timeout 86400;
   }

   # ======= API y archivos estáticos (HTTP normal) =======
   location / {
      proxy_pass http://192.168.100.25:3000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # CAMBIO 1 y 2: los 60s de antes cortaban la generacion masiva de
      # licencias. El tope son 400,000 en lotes de 10,000 y el backend
      # responde hasta el final: al pasar el minuto nginx devolvia 504
      # aunque las licencias se siguieran creando.
      proxy_read_timeout 3600;
      proxy_send_timeout 3600;
      proxy_connect_timeout 10;

      # Evitar buffer completo del body para subidas grandes
      proxy_request_buffering off;

      # CAMBIO 3: la exportacion de licencias escribe la respuesta por
      # streaming (res.write por lote). Sin esto nginx la acumula entera
      # antes de mandarla al navegador.
      proxy_buffering off;
   }

   listen 443 ssl; # managed by Certbot
   ssl_certificate /etc/letsencrypt/live/casaexpress.metabooks.com.mx/fullchain.pem; # managed by Certbot
   ssl_certificate_key /etc/letsencrypt/live/casaexpress.metabooks.com.mx/privkey.pem; # managed by Certbot
   include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
   ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ============================================
# Redirección HTTP -> HTTPS
# ============================================
server
{
    if ($host = casa.metabooks.com.mx) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

   listen 80;
   server_name casa.metabooks.com.mx;
   return 404; # managed by Certbot
}

server
{
    if ($host = casaexpress.metabooks.com.mx) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

   listen 80;
   server_name casaexpress.metabooks.com.mx;
   return 404; # managed by Certbot
}


